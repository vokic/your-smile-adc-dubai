[build]
  command = "npm run build"
  publish = "dist/public"

# Prerender produces a real HTML file per route under dist/public, so Netlify
# serves those directly with pretty URLs (e.g. /veneers → /veneers/index.html).
# Only paths that match no static file fall through to the 404 page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
