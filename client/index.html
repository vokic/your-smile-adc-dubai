<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!--
      Per-page <title>, <meta description>, canonical and JSON-LD come from
      the <SEO> component in client/src/components/SEO.tsx and are baked into
      each route's HTML by the post-build prerender step. The shell stays
      intentionally bare so static fallback tags don't compete with the
      React-rendered ones during the snapshot.
    -->
    <meta name="author" content="Your Smile Advanced Dental Center" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <!-- Google Search Console: set VITE_GSC_VERIFICATION in Netlify env to the
         token from the "HTML tag" verification method. Empty = tag omitted. -->
    <meta name="google-site-verification" content="%VITE_GSC_VERIFICATION%" />

    <!-- Consent Mode v2 defaults. Must run BEFORE the GTM snippet. A returning
         visitor's choice (saved by CookieConsent under "ysadc-consent") is
         applied here, synchronously, so the first page view already carries
         it; everyone else starts denied until they answer the banner. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      (function(){
        var choice = null;
        try { choice = localStorage.getItem('ysadc-consent'); } catch (e) {}
        var state = choice === 'granted' ? 'granted' : 'denied';
        gtag('consent', 'default', {
          ad_storage: state,
          ad_user_data: state,
          ad_personalization: state,
          analytics_storage: state,
          wait_for_update: choice ? 0 : 500
        });
      })();
    </script>
    <!-- Google Tag Manager. Container ID comes from VITE_GTM_ID (Netlify env).
         GA4 and Meta Pixel are configured inside GTM, not in app code. When
         the env var is empty the snippet is stripped at build time by
         vite-plugin-tracking.ts. -->
    <script data-gtm>
      (function(w,d,s,l,i){if(!i||i.indexOf('%')===0){return;}w[l]=w[l]||[];w[l].push({'gtm.start':
      new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
      'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer','%VITE_GTM_ID%');
    </script>

    <!-- Icons. Fonts are self-hosted via @fontsource (imported in main.tsx). -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#ffffff" />
  </head>
  <body>
    <noscript data-gtm><iframe src="https://www.googletagmanager.com/ns.html?id=%VITE_GTM_ID%"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <div id="root"></div>

    <!-- Netlify Forms: static form so the build-time bot detects it.
         The real React form posts to "/" with the matching form-name. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
