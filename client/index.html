<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Fallback defaults. Per-page <SEO> component overrides these from React. -->
    <title>Your Smile Advanced Dental Center - Best Dentist in Dubai</title>
    <meta name="description" content="Your Smile Advanced Dental Center in Dubai JLT offers premium dental services: veneers, implants, Invisalign, teeth whitening, and emergency care." />
    <meta name="keywords" content="dentist in Dubai, dental clinic Dubai, veneers Dubai, dental implants, Invisalign Dubai, teeth whitening, emergency dentist" />
    <meta name="author" content="Your Smile Advanced Dental Center" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Fonts & Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Preload Critical Resources -->
    <link rel="preload" as="image" href="/hero-image.jpg" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#ffffff" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify Forms: static form so the build-time bot detects it.
         The real React form posts to "/" with form-name=contact. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
